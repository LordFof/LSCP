name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -o LSCP_build_package.zip -d buildsrc

      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix MainActivity padding syntax
          p = Path("buildsrc/app/src/main/java/cz/ls170/colormatcher/MainActivity.kt")
          s = p.read_text()

          s = s.replace(
              "orientation=LinearLayout.VERTICAL;padding=24",
              "orientation=LinearLayout.VERTICAL;setPadding(24,24,24,24)"
          )

          s = s.replace(
              "textSize=28f;padding=16",
              "textSize=28f;setPadding(16,16,16,16)"
          )

          p.write_text(s)

          # Fix Java/Kotlin JVM target mismatch.
          # The project currently compiles Java for 1.8 while Kotlin uses 17.
          # Force Kotlin to target Java 8 so both tasks use the same target.
          gradle_file = Path("buildsrc/app/build.gradle.kts")
          g = gradle_file.read_text()

          if "kotlinOptions" not in g:
              marker = "android {"
              if marker in g:
                  g = g.replace(
                      marker,
                      '''android {
              kotlinOptions {
                  jvmTarget = "1.8"
              }''',
                      1
                  )

          gradle_file.write_text(g)

          print("Source fixes applied")
          PY

      - name: Build APK
        working-directory: buildsrc
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LS170ColorMatcher-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
