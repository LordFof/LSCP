name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          mkdir buildsrc
          unzip LSCP_build_package.zip -d buildsrc
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {\n",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
              1
          )
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: buildsrc
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LS170ColorMatcher
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
